elBetting: https://www.rebelbetting.com/\n- Trademate Sports: https://tradematesports.com/\n- BetBurger: https://www.betburger.com/\n- A third-party review of BetUnfair: https://tennisedge.io/betunfair-value-betting-tool/\n\n## Research sources\nThe full source lists sit at the bottom of `BRIEF.md`, `SEO_SNAPSHOT.md` and `GEO.md`.\n", "notion": "https://app.notion.com/p/3f4fc839fab981d2a98de2b971ae7f49", "notionFresh": true}, {"slug": "assets", "label": "What you bring", "group": "You", "file": "study/ASSETS.md", "md": "# What you bring — your work mapped to BetUnfair\n\nSources: `evidence/LIMITLESS_CONTRIBUTION_ANALYSIS.md`, the Master Strategic Document (Notion, May 2026), the Tooling Landscape Research (Notion, May 2026), CV v2.\nShort strategy page: https://claude.ai/public/artifacts/3a9f0239-eac7-485c-a5a8-fe358ce6cf27 (I did not open this page; I worked from the Notion docs and the local evidence file).\n\n**Sharing rule:** talk about your method and your public research freely. Limitless's own numbers, thesis and plans stay private. The tool research is built from public sources, so its facts are safe to use.\n\n---\n\n## 1. The strongest link: you already wrote about their customer\n\nYour strategy, Part 5, **segment one** is \"value bettors and sharps, often limited or banned\". That is BetUnfair's user. You already know:\n- **Who:** skilled bettors who calculate edge; many limited by Bet365 and similar.\n- **Pain:** limits and bans; Betfair's premium charge; Pinnacle blocked in the UK, much of the EU and the US; Asian books are hard to use.\n- **Where they are:** sharp parts of Reddit, Telegram channels, X accounts, Discords. Tight and small.\n- **How to reach them:** be present and useful, not ads. Education. Tools they find by themselves.\n- **Size:** mid five to low six figures of serious value/arb bettors worldwide. Tens of thousands on the leading +EV tools.\n\nOne sentence for the interview:\n> \"At Limitless I mapped this exact user — the value bettor who gets limited — as our top segment. I know where they sit and what they pay for.\"\n\n## 2. Your tool research = their competitor map\n\nYou mapped 170+ tools in 22 categories. Useful facts for BetUnfair:\n- +EV tools cost **€100–400 a month** (Trademate, OddsJam). BetUnfair at **€27–96** is the cheap serious option. That is a positioning line.\n- Gaps you found in the market: tools are US-sport first; football and Asian handicap are second-class; little for LATAM and South-East Asia; mostly web, weak on Telegram and Discord.\n- Bet trackers are the first tool new bettors adopt (Pikkit, BetStamp, spreadsheets). BetUnfair has a tracker with bet import. **A free tracker could be the front door.**\n- Calculators (Kelly, no-vig, surebet) are free everywhere and bring search traffic. BetUnfair has a stake calculator behind login.\n- Tipsters need **verified results**. No clean answer exists. BetUnfair's tracker with CLV could give tipsters a public proof page.\n- AI tip apps fail on trust. BetUnfair's \"how we measure latency\" posts are the right answer to that.\n\n## 3. The scanner idea Baptiste liked (assumed: a free or cheap tool as the way in)\n\nWhat you built: Odds Scanner Pro. Solo, in production, on their own OddsPapi feed. 13 bookmakers, 6 market types, referral tracking from link to sign-up, partner dashboards, Telegram alert bot.\n\nWhy it matters to them:\n- You proved you can **ship a working product on their data**, alone, fast.\n- You know their API as a customer: package choice, refresh speed, cost.\n- Same play fits BetUnfair: **a free tool on top of data they already own** brings search traffic, links and trials. Examples: free arbitrage or \"best odds\" page, free no-vig calculator, free limited dropping-odds feed with a delay.\n- Arbitrage users are a feeder segment. They already pay for tools. When they get limited, value betting is the next step.\n\n## 4. Stories (2 minutes each, one number each)\n\n| Story | The need it answers | Number |\n|---|---|---|\n| OddsPapi deal and listing | \"Can you run partners and vendors?\" | $1,330 vs $2,500–3,000 a month; refresh 60 → 12 min |\n| Scanner with referral tracking | \"Can you build and measure?\" | 13 bookmakers; link-to-sign-up tracking end to end |\n| 170+ tool research and strategy | \"Do you know our market?\" | 170+ tools, 22 categories |\n| Tipster and creator programme | \"Can you run affiliates?\" | 1,000+ accounts screened; tipster at €2,000 a month; 25 videos at ~$47 |\n| AI content system | \"Can you scale content with a small team?\" | edits per video ~60 → ~0; only format Instagram approved for ads |\n| Agency SEO (WunderAd) | \"Did you do SEO?\" | Ceresit community 30,000+ via multichannel, SEO and CRM |\n\n## 5. SEO: what you can honestly say (fill the gaps)\n\nFrom the CV: 7 years running an agency, 100+ projects, SEO was part of the Ceresit work.\n**I need from you, to make this story solid:**\n- 2–3 SEO projects by name, and what you did yourself (strategy, briefs, tech audits, link building, managing a specialist?).\n- Any number: traffic growth, rankings, leads.\n- How fresh: last hands-on SEO year.\n\nHonest framing if hands-on SEO was years ago:\n> \"I ran SEO as part of client work for 7 years — strategy and managing specialists. The craft has moved to AI search since. Here is how I'd run both for BetUnfair.\" Then use `SEO_SNAPSHOT.md` and `GEO.md`.\n\n## 6. Arbitrage vs value (side note only)\nTheir blog prefers value betting over arbitrage. No need to raise it. If it comes up: arbers are a feeder audience, and a free scanner is a way to meet them.\n", "notion": "https://app.notion.com/p/3f4fc839fab98130a64dcf895249674c", "notionFresh": true}, {"slug": "talk", "label": "Talking points", "group": "You", "file": "study/TALKING_POINTS.md", "md": "# Talking points\n\nLines to say out loud, collected from the playbook pages. Private: these sections were taken off the public playbook so the company sees the strategy, not the preparation.\n\n## Links and mentions\n\n- \"The newest data says AI names brands that the rest of the web links to and talks about. BetUnfair has 259 linking domains; Pinnacle Odds Dropper has 1,600.\"\n- \"We would build links the way we build content: from the data. Every chart, page and free feed carries a credit link.\"\n- \"The fastest way to get age is to borrow it: OddsPapi's older pages, partners and affiliates.\"\n\n## GEO (AI search)\n\n- GEO means BetUnfair gets named when a bettor asks ChatGPT or Perplexity for the best dropping odds tool.\n- The basics are fine (crawlers allowed, pages readable). The gap is off-site: in our tests BetUnfair did not show up, OddsJam owns about two thirds of the answers, and Pinnacle Odds Dropper is nearly invisible too. The niche is open.\n- Three moves in 90 days: set a baseline; get mentioned where models look (Reddit, YouTube, cited roundups, the OddsPapi blog); publish what only 55 Tech has (monthly sharp-line data, proper comparison pages).\n- Skip the hype: llms.txt does nothing and schema does little. AI is about 1% of traffic today, so this is a small bet with a clear metric, on top of SEO.\n\n## Everywhere in AI\n\n- The AI slot for odds data is crowded but nobody has won it. We win on usage, not on being first.\n- Ship answers, not prices. Free with no key means moves, not price tables, with our name on every answer.\n- ChatGPT's directory is closed to us (13+ rule). Claude, Perplexity, Gemini, Copilot, Grok and Mistral take a connector by URL today.\n\n## Line-move content engine\n\n- A line move is worth most in the first seconds. That is the paid product; we never give it away. The same move keeps story value for weeks.\n- One small machine turns each move into a short, a chart, a page and an email line over time. The scoreboard counts process, never profit.\n- The video part is cheap to build in-house: a code-built animation pipeline with AI voice and a one-click approval step. Cost per video is cents. A human checks every video.\n- Two weeks, one league, ten shorts, one tape page. If it doesn't earn trial starts, we kill it. Check first: price-display rights and each platform's rules.\n\n---\n\n## Emotion-led content\n\n- FOMO is only one feeling. Others: curiosity, fairness, pride, awe and calm (a data tool's honest promise is fewer rash decisions).\n- On FOMO there is one line: it is about information, never about money you could have won. No countdowns, no \"bet now\", no profit maths. UK rules say the same.\n- Every claim gets a scoreboard that counts process, not profit. If we are wrong, we say so in public. That is what makes people share it and trust it.\n\n---\n\n## Creative ways to bring traffic\n\n- **Acquisition idea.** A proof card with average CLV, our mark and a link code. CLV is a process number, not a profit claim, so it is safer in public. Trials per card are countable within a month. Stop if trials stay low after eight weeks.\n- **Making users share.** People share when it makes them look good and takes one tap: a card after a bet beats the close, a monthly summary, a yearly \"Wrapped\". Show process, never rank by profit. If card users churn faster, change the card, not the target.\n- **Referral.** Two-sided credit, paid after the friend pays and the refund window passes (kills most fraud). Revenue share for tipsters and sites, with disclosure. Rivals are reported at ~27% (OddsJam) and up to 50% (RebelBetting): check real terms. Ask legal whether refer-a-friend touches a tool that is not an operator.\n- **If review sites come up.** Run them under their own brand names, rank tools on a published method where BetUnfair is strong, and put the ownership note next to the ranking. That is how OddsJam's owner and Better Collective already work. Only a hidden owner, an \"independent\" claim or fake reviews cross the legal line.\n\n---\n\n## Beyond subscriptions\n\n- Keep subscriptions as the base. Add three lines that use what 55 Tech already has.\n- Front door to OddsPapi and the desk. Count every B2B deal it starts.\n- Earn after the alert, only with venues that welcome winners. That fits the name.\n- Sell trust: verified tipster records and a line-move feed for media and AI tools.\n", "notion": "https://app.notion.com/p/400fc839fab981aaae0fcbceeec23b96", "notionFresh": true}, {"slug": "panel", "label": "How the panel will read it", "group": "You", "file": "study/PANEL_READ.md", "md": "# How the panel will read it\n\nTwo cold reads of the growth playbook and the traffic map, done on 21 Oct 2026. One reader played the CEO, one the head of product. Both read the pages the company would see; neither saw this prep site.\n\n## Their verdict, in one line each\n- **CEO:** \"A strong researcher who found real problems. I don't yet see an operator who picks three things and ships them on a tiny budget. Interview hard, not yet hire.\"\n- **Head of product:** \"A library, not a plan. It needs far more engineering than it asks for, and it breaks its own licence rules. Next round as a working session.\"\n\n## What both liked\n- **The money leaks.** \"No card required\" on two pages against ToS 7.1, a possible EUR 161.99 charge on day 5, three different refund rules. Cheap to fix, fewer chargebacks.\n- **Measure first.** The \"how did you hear\" field, a code per partner, refunds final at day 35, and the honest test size (330-640 trials per arm).\n- **The time ladder.** The live alert stays paid; the same move told later is free content. It uses the one thing rivals cannot copy.\n- **Segment calls.** Dropping the first guess (limited bettors, 1.9%), pros to OddsPapi, no arbers.\n- **Shipped work.** Three rendered films and real mock-ups. Opening the calculators that already exist. Presets on the empty first screen.\n\n## The 12 problems they found\n| # | Problem | Who | Where |\n|---|---|---|---|\n| 1 | **Too much, no focus.** 31 pages, about 96,000 words, 180 cards, about 75 marked Start or Next. Reads as machine-made; tool words leak through (\"cells\", \"stages\", \"gates\": 121 times on 7 pages). | Both | Whole site, map |\n| 2 | **No money goal.** Day 90 promises \"a growth system\", not X more paying users or EUR Y a month. No revenue maths (trials x trial-to-paid x price x months kept) from about 50 trials a week. No budget in euros. | CEO | PLAN_90_DAYS, OVERVIEW |\n| 3 | **The engineering ask is wrong.** \"Half a day a week\" against a plan that needs two or three engineers for a quarter. | Both | PLAN \"Decisions needed\" |\n| 4 | **Reliability is lever one, and it is parked.** Your own Discord read says the refresh bug (open 14 months) and no phone alerts cap growth. The plan lists it as question 9 and answers churn with emails. | Both | DISCORD_INSIGHTS, ENGINE_KEEP |\n| 5 | **The mock-ups break your own licence page.** Home teaser with live Pinnacle prices, match page \"updates every minute\", tape with Bet365 prices, yearly \"data tables\", AI connector marked Next. DATA_LICENCE rates these amber or red. | Head of product | Map gallery, DATA_LICENCE |\n| 6 | **It shames the B2B customers.** \"Bet365 is late by 78 s\" (film A), \"slowest book of the day\", the Speed and Margin Index. OddsPapi sells to sportsbooks, and naming the lag helps books close the gap users pay for. | Both | Films, ALWAYS_ON, LINKS_PLAYBOOK |\n| 7 | **Risky ideas marked Next.** Own review sites under other brands, bought sites and sponsored links, Gen Z meme pages (youth appeal is a regulator red flag for a betting product), a cash cup (legal only with free entry, and there is no free tier). The Pinnacle and exchange referral is the same conflict the plan criticises in Trademate. | Both | Map, LEADERBOARD, AFFILIATE_NETWORK, CREATIVE_TRAFFIC |\n| 8 | **Metrics are off.** Main number \"weekly users who logged a bet\" measures the tracker, not the alerts. Activation is defined four ways. \"The line knew\" is weak proof: an early Pinnacle move usually matches Pinnacle's own close. Tests cannot finish at about 50 trials a week (about 25 weeks per test), yet the plan runs \"two tests a fortnight\" and kills channels after two weeks. | Head of product | PLAN, ENGINE_MEASURE, CONTENT_ENGINE |\n| 9 | **\"Caught vs missed\" misreads the product.** Bet logging is manual, so \"you acted at 14:03\" is unknowable, and \"alert sent, app closed\" emails users proof that alerts failed them. | Head of product | Map, PLAN days 31-60 |\n| 10 | **Confidentiality and tone.** The shareable link names staff (Martin, Pablo), says \"support is slowing\" and lists legal faults. \"The site trips over itself\" reads as an audit of them, not a plan with them. | CEO | DISCORD_INSIGHTS, OVERVIEW |\n| 11 | **Contradictions.** Markets: UK and US, then France and Sweden, then Spanish and Portuguese, then Italian. Commission: 25% vs 30-40%. Match pages in days 31-60 vs \"no thin per-match pages at first\". \"17 sharp books\" vs \"Pinnacle + 4\". | Both | PLAN, SEO_SNAPSHOT, map |\n| 12 | **Scope creep and wrong weight.** Desk tier, brokerage, a Perplexity deal: the job is BetUnfair's funnel. AI gets six pages while AI sends about 1% of visits. | CEO | MONETISATION, AI pages |\n\n## What they expected and did not find\n- One money goal with the maths, and a euro budget.\n- The engineering ask in days, sized honestly.\n- Your first week, day by day.\n- How you work with them: who approves what, the weekly rhythm.\n- A \"not doing\" list.\n- One activation definition and the aha moment: a trial user who opens at least one alert within 48 hours of starting the trial (event: alert opened).\n- How experiments run at this volume: holdouts, bigger effects, guardrails.\n- What data you need, and who builds it.\n- **Proof of you:** one campaign you ran end to end, with budget and result. (Keep it out of the public link; bring it in the room.)\n\n## Where the angle is wrong\n- Churn is a product problem, not an email problem.\n- Proof is a product problem: show trial users the closing-line value of last week's alerts inside the app on day one.\n- Trial conversion is about value inside 5 days, not card-or-no-card copy.\n- 60-90 posts a day will not win a niche; the one partner already gets about 9 times the brand's views on X.\n- A free Telegram bot gives free users phone delivery that payers do not have.\n- The overview opens on awareness (Reddit 4 vs 857). Open on money: untracked trials and the trial leak.\n\n## The questions they will ask\n1. You get half a day of engineering a week. Which three things, and how many euros a month by day 90?\n2. At about 50 trials a week, how do you decide anything in 90 days? Which two or three tests, at what effect size?\n3. Write the SQL for trial-to-paid by source and billing period.\n4. One engineer for six weeks: the content engine, or alert reliability and push?\n5. Own review sites, Gen Z memes, cash cup, \"slowest bookmaker\": which do you drop, and why?\n6. Tell me about one campaign you ran end to end: budget, result, what you killed.\n7. What did AI do here, what did you decide, and what would you cut today?\n8. What do you need from me in week one, and what do you do if I say no?\n9. Why does \"the line knew\" prove value to users? What would you publish instead?\n10. Define activation in one sentence. What data proves it, and who builds that data?\n11. If legal says \"percent only, no bookmaker names\", what is left of the engine?\n\n## The fixes that answer them\n1. **A two-page plan on top.** One money goal with the maths, three bets, a euro budget, the engineering ask in days, the first week, how we work, and a not-doing list. Everything else becomes the research appendix.\n2. **Reliability and push as bet one**, shared with product, with one metric both teams own.\n3. **Fixed metrics.** Paying users and month-two retention as the main numbers, one activation definition, alert closing-line value instead of \"the line knew\", tests sized for about 50 trials a week.\n4. **Licence-safe mock-ups.** Percent moves, no bookmaker names or prices in public, nothing live.\n5. **No shaming of sportsbooks.** Drop \"slowest book\", the Speed and Margin Index, and the \"late by\" framing in public.\n6. **Risky ideas parked** to a \"later, needs legal\" list or kept for the room only.\n7. **Staff names and legal faults off the shareable link;** a \"with you\" tone.\n8. **Contradictions fixed;** tool words removed.\n\n## What changed after this read\nThe playbook now opens on **The plan**: where the money is (the formula and a worked example), three bets sized by effort, how to measure with few users, a budget, the first week, how we work together and a not-doing list. The research pages sit behind it as an appendix. Also changed:\n- Staff names are off the shareable link, and the build now refuses them.\n- \"Beat the close\" replaced \"the line knew\".\n- Public content is percent moves, delayed, with no bookmaker prices and no bookmaker named as slow.\n- The cash cup and the commission-based Pinnacle link are parked.\n- Own review sites and the 18+ meme page stay, each with its legal line.\n\n## Draft answers, in your words\n1. **Half a day of engineering a week: which three things, and what money?** \"I would not promise hours before I see the code. The three things are small: one rule for card, trial and refunds with a reminder before day 5; a 'how did you hear' field and partner codes; presets on the empty first screen. By Friday of week one I show you the money formula filled with your numbers. On public benchmarks, moving trial-to-paid from 30% to 35% is worth about EUR 1,000 for every month of trials.\"\n2. **At about 50 trials a week, how do you decide?** \"Not with A/B tests: a +50% test would take about 25 weeks. I test only big swings, like the card rule. Everything else is read before and after over four weeks with a guardrail on refunds and cancels, emails keep a 10% holdout, channels are read over 6 to 8 weeks on known-source trials, and I talk to five payers and five cancels every month.\"\n3. **SQL for trial-to-paid by source and billing period.**\n   ```sql\n   -- trials older than 35 days, so refunds are final\n   SELECT t.source,\n          t.billing_period,                        -- chosen at checkout when the card is taken\n          COUNT(*)                                             AS trials,\n          COUNT(s.first_paid_at) FILTER (WHERE s.refunded_at IS NULL) AS payers,\n          ROUND(100.0 * COUNT(s.first_paid_at) FILTER (WHERE s.refunded_at IS NULL) / COUNT(*), 1) AS trial_to_paid_pct\n   FROM trials t\n   LEFT JOIN subscriptions s ON s.user_id = t.user_id\n   WHERE t.started_at < CURRENT_DATE - INTERVAL '35 days'\n   GROUP BY t.source, t.billing_period\n   ORDER BY trials DESC;\n   ```\n   Say out loud: the source column is empty today for most trials, which is why the field comes first.\n4. **One engineer for six weeks: content engine or alert reliability?** \"Reliability. Churn caps everything, and your own users name it. The content loop runs outside the product codebase, so it does not compete for that engineer.\"\n5. **Which risky ideas do you drop?** \"Cash prizes until there is a free tier, because free entry is the legal condition. Content that names a bookmaker as slow, because OddsPapi sells to sportsbooks. Commission from bookmakers, so alerts stay neutral. I keep our own review sites under their own brand names with the ownership note next to the ranking, which is how OddsJam's owner and Better Collective work, and an 18+ meme page with adult humour only.\"\n6. **One campaign you ran end to end.** Use the arbitrage-scanner work: you pitched the role, researched the market (the 60%-live finding that shaped the live-liquidity push), built the scanner, and it flagged 16+ liquid matches and about USD 3,980 of platform volume. Add the API cost cut (about 50% saved) as the \"what I killed or cut\" part. Tell it in your own words, with budget, result and what you stopped.\n7. **What did AI do, what did you decide, what would you cut?** \"AI did the reading and the first drafts: 1,730 Discord messages, rival sites, studies. I decided the focus: three bets, what to park, the proof number and what we never publish. I already cut the AI pages and the beyond-subscription ideas to 'later'.\"\n8. **What do you need in week one, and what if I say no?** \"Read access to billing, analytics, the feed and the alert log, one product contact, and a yes on one rule for card and refunds. If data access is a no, I tag sources from day one with the field and codes and rebuild the funnel from billing exports.\"\n9. **Why does \"the line knew\" prove value?** \"It does not, and I dropped it: an early Pinnacle move matches Pinnacle's own close almost by definition. Beat the close measures the alert itself: the soft-book price at alert time against that bookmaker's closing price.\"\n10. **Define activation.** \"A trial user who opens at least one alert within 48 hours of starting the trial. One event, alert opened with the alert id; product logs it, I build the table. The supporting number is weekly users with a bet logged.\"\n11. **If legal says percent only, no bookmaker names?** \"That is already the public version: percent moves, delayed, the sharp market as a whole. The scoreboard, the recaps, the how-the-odds-moved pages and the films all still work. Prices stay inside the product, which is where they sell.\"\n\n## Five-angle audit of the traffic map (22 Oct)\nFive readers went through the map at once: the CEO, the head of product, a gambling-marketing lawyer, a product designer and a limited value bettor. What they found, and what changed.\n\n**Fixed on the map**\n- **One example world.** The mock-ups contradicted each other (Betis at −11.9%, −12.6% and −16.9%; the same minute reused on three posts; a move timed after kick-off). Every mock-up now uses one dated weekend: Betis v Valencia (Sun 25 Oct, 15:00), Inter v Napoli, Djokovic v Fritz, Chelsea v Man City, Lakers v Warriors, Sinner v Alcaraz, with numbers that add up.\n- **Internal notes off public screens** (\"older note\", \"confirm before launch\"). Rivals named on the review-site mock-up (Pinnacle Odds Dropper, RebelBetting), with the method visible.\n- **Proof shown honestly.** The verdict card no longer repeats one number twice; the scoreboard states its method (every alert, misses included, \"results are not typical, the alert price may not be available at your bookmaker\"); share cards say \"bets tracked\", never \"alerts acted on\" (the tracker is manual); \"verified\" now means \"logged before kick-off, odds checked against the feed; stake and placement are not verified\".\n- **Product facts.** Future Dropping Odds is marked paused; the competition toggle is gone (no free tier yet, so \"free to enter\" would be false); the limit log names no bookmaker; price shown as \"from €27 on the 6-month plan, €34.99 monthly\".\n- **The missing card.** \"Signals API: delayed, percent-only, with closing prices\": the one product build every public post and the scoreboard need. Bet 3's effort is now medium for product, on The plan too.\n- **Statuses re-cut to the plan.** Start = the three bets and their parts (16 cards, including the X and Telegram feeds, recaps and verdict cards). Next = what follows once the bets run (11). Parked: buying sites for links, the AI connector, the browser extension, the embed widget.\n- **Every Start and Next card** now carries an engineering need (none, small, medium) and a kill rule.\n- **Two cards the CEO missed:** paid ads costed as a Skip (why they cannot pay back at about €95 net per payer), and the three Discord users who offered to promote, as the cheapest partner start.\n- **Legal marks.** 18+ and \"bet responsibly\" on every public post and page mock-up; no countdown next to a call to action; exchanges described as \"do not limit stakes by skill\", not \"keep winning after limits\".\n- **The page itself.** Keyboard: Tab flies to the card instead of breaking the canvas, Space opens the panel, focus moves into it and back, arrows pan, 0 jumps to frame 10. The detail panel never covers the card it opened. Overview plates have a minimum size; an open frame hides its own plate; subtitles cannot run under cards; filters report \"N cards in M frames\"; tap targets are bigger; \"Later\" pills pass contrast.\n- **23 cards had no links to anything**; each now has one.\n\n**Kept against advice, on your call**\n- The 18+ meme page. The CEO and the lawyer would shelve it; it stays as planned, with 18+ marking as the one legal line.\n- Own review sites under other brands (lawyer: the ownership note is not enough if the site claims to be independent). Ours never claims independence; the ownership note sits above the ranking and rivals are named. Buying existing sites is parked.\n- Exchange partnerships (CEO: it makes BetUnfair the anti-bookmaker tool at the events where OddsPapi sells). Kept with no commission, factual wording, and a kill rule.\n\n**Not changed, worth knowing**\n- The three films still show bookmaker names and prices. They stay off the public GitHub map and are labelled internal demos on the private one. A public version needs a re-render.\n- The data-licence card is our own reading; the lawyer and the head of product both want 55 Tech's written confirmation, including upstream providers, before any public post.\n- The bettor ranked what he would act on: the scoreboard, the comparison page, the match page, the yearly report and the limit-alert post. Bottom: the quiz, the partner page, the review site, Wrapped.\n\n**Questions the map will now draw**\n1. \"Which of your Start cards need my engineers, and for what?\" Every card says it: five need product work, all small or medium; the Signals API is the one that matters.\n2. \"What stops a channel?\" Every Start and Next card has a kill rule.\n3. \"Can you show bookmaker odds in public?\" No: percent moves, 30 minutes late, no bookmaker named as slow, and written sign-off before launch.\n\n## Five-angle audit of the growth playbook (22 Oct)\nThe same five readers went through all 31 playbook pages: the CEO, the head of product, a gambling-marketing lawyer, a senior editor and a limited value bettor. About 120 findings, 457 edits across 27 pages, plus the site build and template. A checker (`.drafts/playbook-audit/check.py`) sweeps the 21 defect classes and reads clean. Every edit is logged in `.drafts/playbook-audit/log-A.md` and `log-B.md`.\n\n**Fixed on the playbook**\n- **The first page now answers the CEO in two minutes.** An \"In short\" box (four numbers, three bets, fixed cost, what is needed in week one) and a \"Words used\" box (sharp book, soft book, closing price, CLV, tape). Point headings instead of topic headings on the first three pages. A \"What this needs from 55 Tech\" table with effort and timing for every ask, and the parked list.\n- **Money logic.** Bet 1's lever is trial-to-paid; refunds live only inside net cash per payer (no double count). The €95 monthly payer now says what it assumes (early cancels at app-store retention, 25% VAT). The partner \"9x\" is labelled a sample of one, and partner trials are worth 25% less after the share. The day-90 commitment is a forecast payback, because real payback is not visible until day 185.\n- **Product asks sized honestly.** Bet 1 is medium, not small (source and cancel-reason fields, presets, reminder, cancel link, four tracking events, 17 site tickets). Bet 2 is medium to large: the root cause of alerts stopping is unknown. The signals feed has a spec box (one row per alert fired by a content rule, fields, miss = zero or below, 30-minute publish-after, internal read-only table, four weeks of private counts before anything is public). The free tier is named as a large product call, and everything that waits for it says so.\n- **One definition each.** Activation = a trial user who opens at least one alert within 48 hours (event: alert opened). Beat the close = the alert's soft-book price against the sharp book's no-vig close at kick-off, every alert counted, misses included, with a method link and \"Beating the closing price is not profit. Results are not typical. 18+.\" on every card. No \"best three alerts\" cherry-picks anywhere.\n- **The B2B rule enforced on every page.** Percent moves only, at least 30 minutes late (eight places said 15-25 minutes), no prices in any hook or template (six templates printed prices), no bookmaker named as slow, lagging or limiting (17 places: per-book latency pages, \"which books lagged\", limit survival by book, the founder letter, named limit stories). Republishing is now a confirmation (\"written sign-off from 55 Tech, covering upstream, before any public post\"), not an open question that asked to show prices.\n- **The not-doing list enforced.** No commission from exchanges (three monetisation lines parked), no paid placements (sponsorships, pay-per-view clippers, bought Telegram posts parked), cash prizes and the challenge wait for a free entry route, Spanish only after day 60 (Portuguese, Italian, German, Russian removed), AI connectors day 60 or later with one OddsPapi engineer, no datasets or CSV exports or free signals API, bought review sites parked.\n- **Facts.** Telegram alerts do not exist (two pages said they did). Future Dropping Odds is paused and no longer counted (the teardown scored 12/12; now 11). Basic is €34.99 monthly and €27 on 6-month billing; \"undercuts\" and \"the price gap is real\" are gone, like-for-like only. Trademate's \"earns bookmaker commissions\" accusation removed (not found). The stale rival table on the 90-day page is replaced by a pointer to the teardown. \"Nine of nine checks failed\" replaced with what the later check found. 126 Discord users, nine OddsPapi languages.\n- **Legal lines.** Every public post ends with \"18+. Odds data, not advice. BeGambleAware.org\". Win-back and trial emails only to people who ticked the marketing box, \"our reading, confirm with counsel\". Affiliate disclosure is \"we earn a commission … Ad.\", never \"may earn\". Reviews invite every customer, including leavers. Reddit: a named team member from a real, disclosed account, threads read in a browser or through the official API, never \"aged accounts\" or cold DMs. Rivals' terms read before benchmarking. The meme contest has written rules, entry 18+ in an age-gated channel, free entry, a free month as the prize.\n- **Exposure removed.** Speculation that OddsPapi scrapes its prices, the \"shut it down is plausible\" and runway lines, the partner's X handle and promo codes, Discord quote month labels, \"before salary\", \"the job\", hourly staff rates, \"I/my\" voice. Named B2B client lines dropped. The five research pages carry \"Prepared for 55 Tech. The findings about BetUnfair's own pages are for the team to fix, not to quote.\"\n- **The page itself.** \"On this page\" now shows on every screen width (a closed box above the page on phones and laptops). The header example is labelled a worked example. The 90-day phases are stage cards; the funnel has edge labels; captions no longer advertise gaps. Three finished mock-ups were unused and are now placed (home-page teaser, verified badge, yearly report); the paused-feature mock-up is replaced. Groups: GEO and AI gaps moved to \"be found\", bettor problems to \"be seen\", the leaderboard to \"later\", and \"Later: AI connectors (after day 60)\" says when.\n\n**Kept against advice, on your call**\n- The meme page wording (young-adult moderators, Gen Z, \"bookmakers limiting winners\" as a topic). The lawyer wanted moderators aged 25+ and no \"bookmakers\" in the topics.\n- Own review sites under other brand names (kept, ownership note, never \"independent\"). Buying existing sites is parked, as on the map.\n- Exchange partnerships paid in kind, no commission (the lawyer wanted \"Ad. 18+.\" on the offer line; that is in).\n- \"6 of 17 sharp books at or under 2 seconds\" (about BetUnfair's own claim; no bookmaker named).\n\n**Not applied: page cuts and merges (your decision)**\nAll five readers would cut or merge pages. The common votes: ai-surfaces + ai-gaps into ai-dist (AI sends about 1% of visits); ai-rank into links; hacks into creative; money-models into money; assets cut; the six content pages (content-engine, always-on, creative, emotions, hacks, repurpose) into one content page plus a parked list. The CEO would also cut money and assets from the public playbook and park affiliate-net. Nothing was merged; say the word and it is one build.\n\n**Added on Murad's ask (22 Oct, later): matched betting.** A research page (UK-shaped market, about 9,900 searches a month; OddsMonkey and Outplayed are one business and sell a £1,000-a-year value-betting upgrade; outside the UK and Ireland the method mostly breaks for lack of a lay exchange). On The plan from day 31: next-step page, five-email course, the ten answer posts, a lay calculator, an alternative page; in the product a promo-bet tag (small) and a private offer-EV check (medium, needs exchange prices). Two mock-ups and four map cards. The line to hold in the room: no affiliate links, no logos, plain-text names, nothing public built from bookmaker terms until 55 Tech agrees in writing; a large bookmaker group is suing the OddsMonkey owner over trade marks, so this is where the B2B relationship matters most.\n\n**Questions the playbook will now draw**\n1. \"What do you need from my engineers, and when?\" The table on The plan: nine asks with effort and timing; five are small, two medium (signals feed, site tickets), one medium to large (alerts that arrive), the free tier large and parked.\n2. \"What does the scoreboard calculate?\" The spec box under Bet 3: which price, which close, what is a miss, delay, history, who owns it.\n3. \"Can anything here annoy a sportsbook that buys OddsPapi?\" The rule is on the first page and now holds on all 31 pages; the checker proves it.\n4. \"Why will partners deliver?\" Honest now: one partner measured, a sample of one; a gate (no partner before the source field and codes are live); worth 25% less after the share.\n5. \"What is the real cost?\" Fixed €500-1,100; bought sites parked; no hidden spend left on the research pages.\n", "notion": "https://app.notion.com/p/400fc839fab98157b99ad06adc6a8333", "notionFresh": true}, {"slug": "maths", "label": "Betting maths", "group": "Study", "file": "study/01-betting-maths.md", "md": "# Betting maths\n\nFrom two bookmaker prices to a fair price and an edge. BetUnfair runs this calculation at scale.\n\n---\n\n## 1. Odds are probabilities with a fee\n\n**Decimal odds** (Europe): the return per 1 staked, stake included. Odds 2.50: stake 10, return 25.\n**Implied probability** = 1 ÷ decimal odds. Odds 2.50 → 40%. Odds 1.80 → 55.6%.\n\n| Format | Example | To decimal |\n|---|---|---|\n| American, plus | +150 | 1 + 150/100 = 2.50 |\n| American, minus | −200 | 1 + 100/200 = 1.50 |\n| Fractional (UK) | 5/2 | 5/2 + 1 = 3.50 |\n\n## 2. The margin (also \"vig\", \"juice\", \"overround\")\n\nA fair coin is 50/50 (fair odds 2.00 and 2.00). A bookmaker offers 1.95 and 1.95.\nImplied: 51.28% + 51.28% = **102.56%**. The extra **2.56%** is the margin. That is how bookmakers earn.\n\n```mermaid\nflowchart LR\n%% source: our arithmetic on example odds 1.95 and 1.95 (made-up prices); the sharp 2-3% and soft 5-8% margin ranges are not given on this page\n  A1[\"Bookmaker odds<br/>1.95 and 1.95\"] --> B1[\"Implied probability = 1 ÷ odds<br/>1 ÷ 1.95 = 51.28% each\"]\n  B1 --> C1[\"Add both sides<br/>51.28% + 51.28% = 102.56%\"]\n  C1 --> D1[\"Margin = 102.56% - 100%<br/>= 2.56%\"]\n  E1[\"Fair coin: odds 2.00 and 2.00<br/>50% + 50% = 100%<br/>margin 0%\"] -->|\"for comparison\"| C1\n  D1 --> F1[\"Sharp books: about 2-3%<br/>Soft books: 5-8% or more\"]\n```\n\n- **Sharp books** (Pinnacle, Asian books): margin about 2–3%. They take big bets and let winners play. Their prices are the best public guess of the true chance.\n- **Soft books** (Bet365, most local brands): margin 5–8% or more. Slower prices; they limit winners.\n\n## 3. Remove the margin to get the fair price\n\nScale the sharp book's probabilities back to 100%.\n\nPinnacle: home 2.10, away 1.80.\n- Implied: 47.62% + 55.56% = 103.17%.\n- Fair: 47.62 ÷ 103.17 = **46.15%**. 55.56 ÷ 103.17 = **53.85%**.\n- Fair odds: 1 ÷ 0.4615 = **2.167**. 1 ÷ 0.5385 = **1.857**.\n\n```mermaid\nflowchart LR\n%% source: our arithmetic on example Pinnacle odds 2.10 and 1.80 (made-up prices)\n  A2[\"Pinnacle odds<br/>home 2.10 · away 1.80\"] --> B2[\"Implied = 1 ÷ odds<br/>47.62% + 55.56% = 103.17%\"]\n  B2 --> C2[\"Margin = 103.17% - 100%<br/>= 3.17%\"]\n  B2 --> D2[\"Scale back to 100%<br/>47.62 ÷ 103.17 = 46.15%<br/>55.56 ÷ 103.17 = 53.85%\"]\n  D2 --> E2[\"Fair odds = 1 ÷ fair probability<br/>home 2.167 · away 1.857\"]\n```\n\nThis is the simple \"proportional\" method. Other methods treat favourites and outsiders differently.\n\n## 4. Expected value (EV)\n\n**EV = fair probability × offered odds − 1**\n\nA soft book offers 2.25 on home. EV = 0.4615 × 2.25 − 1 = **+3.85%**.\nOn average, over many bets, every €100 staked returns €3.85 profit.\n\n```mermaid\nflowchart LR\n%% source: our arithmetic on example odds: fair probability from section 3 and a soft-book price of 2.25 (made-up prices)\n  A3[\"Fair probability, home<br/>46.15% from section 3\"] --> C3[\"EV = fair probability × odds - 1<br/>0.4615 × 2.25 - 1\"]\n  B3[\"Soft book odds, home<br/>2.25\"] --> C3\n  C3 --> D3[\"EV = +3.85%<br/>above 0 means a value bet\"]\n  D3 --> E3[\"Every €100 staked<br/>returns €3.85 profit on average\"]\n```\n\nA **value bet** is any bet with positive EV. The bettor backs one side only, with no hedging. BetUnfair's \"EV comparison\" does this across soft books.\n\n## 5. Dropping odds: the same idea over time\n\n- 12:00 Pinnacle home 2.10. Soft book 2.10.\n- 12:01 Big money hits Pinnacle. Price drops to 1.95.\n- 12:01–12:05 The soft book still shows 2.10. That gap is the value.\n\nThe alert must arrive before the soft book moves. So BetUnfair sells **speed** (\"alerts under 2 seconds\") and writes about measuring latency. A fast drop caused by sharp money is a **steam move**.\n\n## 6. Closing line value (CLV): the honest scoreboard\n\nThe **closing line** is the last price before the game starts. It holds the most information.\n\n**CLV = bettor's odds ÷ fair closing odds − 1**\n\nBet at 2.25, Pinnacle fair close 2.05: CLV = 2.25 ÷ 2.05 − 1 = **+9.8%**.\n\n```mermaid\nflowchart LR\n%% source: our arithmetic on example odds: a bet at 2.25 and a fair close of 2.05 (made-up prices)\n  A4[\"Odds the bettor took<br/>2.25\"] --> C4[\"CLV = bettor odds ÷ fair closing odds - 1<br/>2.25 ÷ 2.05 - 1\"]\n  B4[\"Fair closing odds, Pinnacle<br/>2.05 - the last price before the game\"] --> C4\n  C4 --> D4[\"CLV = +9.8%\"]\n  D4 --> E4[\"Beating the closing line shows skill<br/>long before profit does\"]\n```\n\nProfit over 100 bets is mostly luck. CLV shows skill much sooner. A user who beats the closing line but is down this month is doing it right. For growth: **CLV keeps a user through a losing month.**\n\n## 7. Variance: why good bettors have bad months\n\n500 bets, odds around 2.00, 3% edge, 1 unit each.\n- Expected profit: 500 × 0.03 = **+15 units**.\n- One standard deviation: about √500 ≈ **22 units**.\n- So finishing **below zero after 500 good bets** happens about 1 time in 4.\n\nProduct lesson: users need many bets, flat stakes and patience. Many quit in the first bad run (churn).\n\n## 8. Stake sizing\n\n- **Flat stakes:** same amount each bet, often 1% of bankroll. Right for beginners.\n- **Kelly:** stake share = EV ÷ (odds − 1). For the bet above: 0.0385 ÷ 1.25 = 3.1% of bankroll.\n- Full Kelly swings hard. Most use **quarter Kelly** (here 0.77%).\n- BetUnfair has a stake calculator for this.\n\n```mermaid\nflowchart LR\n%% source: our arithmetic on the example +3.85% bet at odds 2.25 (made-up prices)\n  A5[\"Stake sizing for the +3.85% bet<br/>odds 2.25\"] --> B5[\"Flat stakes<br/>same amount each bet<br/>often 1% of bankroll\"]\n  A5 --> C5[\"Kelly = EV ÷ (odds - 1)<br/>0.0385 ÷ 1.25\"]\n  C5 --> D5[\"Full Kelly = 3.1% of bankroll<br/>swings hard\"]\n  D5 -->|\"÷ 4\"| E5[\"Quarter Kelly = 0.77%<br/>what most use\"]\n```\n\n## 9. ROI and yield\n\n- **Yield** = profit ÷ total staked. A good value bettor: 2–5%.\n- **ROI on bankroll** = profit ÷ starting bankroll. Can be much higher, because the same money is staked many times.\n- BetUnfair quotes \"8.97% average ROI/month\". The claim should say which measure it is and how it is calculated.\n\n## 10. Arbitrage, for contrast\n\nBet both sides at different books so the implied probabilities sum to **under 100%**.\nBook A home 2.15, Book B away 1.95: 46.51% + 51.28% = 97.79%. Guaranteed profit ≈ 2.3%.\n\n```mermaid\nflowchart LR\n%% source: our arithmetic on example odds 2.15 and 1.95 (made-up prices)\n  A6[\"Book A home 2.15<br/>Book B away 1.95\"] --> B6[\"Implied = 1 ÷ odds<br/>46.51% + 51.28% = 97.79%\"]\n  B6 --> C6[\"Under 100% = arbitrage<br/>guaranteed profit about 2.3%\"]\n  C6 --> D6[\"Split €100 by share of 97.79%<br/>home 100 × 46.51 ÷ 97.79 = €47.56<br/>away = €52.44\"]\n  D6 --> E6[\"Return about €102.26 either way<br/>profit €2.26\"]\n```\n\n| | Arbitrage | Value betting |\n|---|---|---|\n| Bets per event | all sides | one side |\n| Risk per bet | none (in theory) | real |\n| Profit per bet | small, sure | bigger on average, bumpy |\n| Accounts | limited fast | last longer |\n| Needs | several funded accounts at once | patience and volume |\n\n## 11. Common words\n- **Moneyline / 1X2:** who wins (2-way, or 3-way with the draw).\n- **Totals:** over/under a number of goals or points.\n- **Handicap / spread:** one side gets a head start. **Asian handicap** removes the draw; quarter lines (±0.25) split the stake over two lines.\n- **Player props:** bets on one player's numbers.\n- **Limit:** the most a book lets a bettor stake. High limits mean trust in its price.\n- **Closing line, steam, reverse line movement:** see [Bet types and players](02-strategies-and-players.md).\n\n---\n\n## Exercises\n\n1. Convert to decimal and implied probability: −120 and +180.\n2. A 1X2 market: home 2.40, draw 3.40, away 3.10. What is the margin?\n3. Give the fair probabilities and fair odds for that market.\n4. A soft book offers the draw at 3.70. What is the EV?\n5. A bettor takes over 2.5 goals at 2.02. Pinnacle closes at over 1.90, under 1.98. What is the CLV?\n6. Kelly stake for exercise 4, full and quarter, on a €2,000 bankroll.\n7. Book A home 2.15, Book B away 1.95. Split €100 so the win is the same either way. What is the profit?\n\n## Answers\n\n1. −120 → **1.833**, 54.5%. +180 → **2.80**, 35.7%.\n2. 41.67% + 29.41% + 32.26% = 103.34% → margin **3.34%**.\n3. Home 40.32% → 2.480. Draw 28.46% → 3.514. Away 31.22% → 3.203.\n4. 0.2846 × 3.70 − 1 = **+5.3%**.\n5. Implied 52.63% + 50.51% = 103.14%. Fair over = 51.03% → 1.960. CLV = 2.02 ÷ 1.960 − 1 = **+3.1%**.\n6. Full: 0.053 ÷ 2.70 = 1.96% → **€39**. Quarter: 0.49% → **€9.80**.\n7. Home stake = 100 × 46.51 ÷ 97.79 = **€47.56**. Away = **€52.44**. Return about €102.26 either way → profit **€2.26**.\n", "notion": "https://app.notion.com/p/3f4fc839fab98172aa1de25c0aee49d3", "notionFresh": true}, {"slug": "types", "label": "Bet types and players", "group": "Study", "file": "study/02-strategies-and-players.md", "md": "# Bet types and players\n\nWho is in the sports-betting market, how a price moves, and the ways people try to beat it.\n\n---\n\n## 1. Who is who\n\n| Player | Examples | What to know |\n|---|---|---|\n| **Sharp bookmakers** | Pinnacle, Circa, Bookmaker.eu | Low margin, high limits, winners welcome. Best guess of the true price. |\n| **Asian bookmakers** | SBOBet, Singbet (Crown), 3et | Huge football volume, Asian handicap, very sharp. Hard to join directly. |\n| **Soft bookmakers** | Bet365, William Hill, Unibet, most local brands | Higher margin, slower prices, bonuses. Limit or close winners. |\n| **Exchanges** | Betfair, Smarkets, Matchbook | Bettors bet against each other; the exchange takes a commission. Bettors can \"lay\" (bet against). |\n| **Brokers / agents** | AsianConnect, BetInAsia, Sportmarket | One account that reaches several Asian books and exchanges. How Europeans reach sharp books. |\n| **Prediction markets** | Polymarket, Kalshi | Exchange-style, crypto or US-regulated. No limits on winners. 55 Tech sells data on these too. |\n| **Syndicates** | private groups | Professional teams with models and big money. Their bets move sharp lines. |\n| **Tipsters** | Telegram, X, Discord channels | Sell or share picks. Most are unverified. Also the main affiliate channel. |\n| **Tools** | BetUnfair, Pinnacle Odds Dropper, OddsJam, RebelBetting | Sell speed and maths to bettors. |\n\nBetUnfair lists FanDuel among its 17 tracked books. FanDuel is usually called soft. US player props is a likely reason (guess).\n\n## 2. The life of a price\n\n1. **Opening line.** A sharp book posts a first price with low limits. It is a guess.\n2. **Sharps bet it.** The book moves the price after each strong bet.\n3. **Limits go up** as the book grows confident.\n4. **Soft books follow.** They copy the sharp price with a delay of seconds to minutes.\n5. **Closing line.** The last price before the start. The most accurate.\n\n```mermaid\nflowchart LR\n%% source: BetUnfair's own claim of alerts in under 2 seconds; the source is not given on this page\n  A1[\"1 Opening line<br/>sharp book posts a first price<br/>low limits\"] --> B1[\"2 Sharps bet it<br/>book moves the price<br/>after each strong bet\"]\n  S1[\"Syndicates and<br/>sharp bettors\"] --> B1\n  B1 --> C1[\"3 Limits go up<br/>book grows confident\"]\n  C1 --> D1[\"4 Soft books follow<br/>copy the sharp price<br/>seconds to minutes late\"]\n  D1 --> E1[\"5 Closing line<br/>last price before the start<br/>most accurate\"]\n  F1[\"BetUnfair alert<br/>under 2 seconds\"] -->|\"lands inside the delay\"| D1\n```\n\nEverything BetUnfair sells lives in step 4: the delay.\n\n## 3. Ways to beat the bookmaker\n\n```mermaid\nmindmap\n  root((Ways to beat the bookmaker))\n    Use bonuses\n      Matched betting\n    Cover both sides\n      Arbitrage\n      Middles\n    Bet one side - BetUnfair core\n      Value betting\n      Dropping odds and steam chasing\n    Trade or model the price\n      Originating\n      Exchange trading\n    Copy others\n      Following tipsters\n```\n\n| Strategy | How it earns | Main risk | Who does it |\n|---|---|---|---|\n| **Matched betting** | Turn bonuses and free bets into cash: back at a bookmaker, lay at an exchange | Bonuses run out; accounts get restricted | Beginners, mostly UK |\n| **Arbitrage (surebets)** | Bet all outcomes at different books; prices sum to under 100% | Fast limits; voided bets; price moves mid-way | Semi-pros with many accounts |\n| **Middles** | Bet both sides at different handicap lines; win both if the result lands between | Usually a small loss when it misses | Arbers, US spread bettors |\n| **Value betting (+EV)** | Bet one side when a soft price beats the fair price | Variance; needs hundreds of bets | BetUnfair's core user |\n| **Dropping odds / steam chasing** | See a sharp book move, bet the old price at a slow soft book | Speed; the bettor may be late or the move may bounce back | BetUnfair's core user |\n| **Originating** | Build a personal model and beat even the sharp line | Very hard; needs data and skill | Syndicates, quants |\n| **Exchange trading** | Buy and sell a price as it moves, like a stock | Needs screen time and liquidity | Betfair traders |\n| **Following tipsters** | Copy someone's picks | Most tipsters don't win; prices are gone on arrival | Casual bettors |\n\nValue betting and dropping odds are one idea: value betting compares prices at one moment; dropping odds catches the moment the gap opens.\n\n## 4. Line-movement words\n\n- **Dropping odds:** a price is getting shorter. Money is coming for that side.\n- **Steam move:** a sudden drop across several sharp books at once. Usually a syndicate. The strongest signal.\n- **Reverse line movement:** most public bets are on side A, but the price moves towards side B. Big money is on B.\n- **The bounce:** after a sharp drop the price comes partly back. The move went too far, or someone bet the other side on purpose.\n- **Limit change:** the book raises or lowers the maximum stake. Higher limits mean trust in the price.\n- **Volume spike:** unusual money on a market in a short time.\n- **Closed market:** the book pulls the market for a moment. Often news: injury, lineup, weather.\n\nBetUnfair has an alert for almost each of these: **alerts on the signals sharps watch.**\n\n## 5. Limits: the wall every winner hits\n\n- **Why:** a soft book earns from losing customers. A customer who keeps beating the closing line costs money.\n- **How books spot a pro:** bets only prices about to drop; odd stakes like €43.17; small leagues; never touches casino or accumulators.\n- **What happens:** the maximum stake is cut to a few euros (\"limited\", in the UK \"gubbed\"), or the account is closed.\n- **How bettors last longer:** round stakes, popular leagues, skipping the most obvious stale prices, some normal-looking bets.\n- **What they do after:** more accounts and countries, brokers, exchanges, sharp books, prediction markets.\n\nWhy this matters for growth:\n- Limits are the top reason a happy user stops needing the tool (churn).\n- Limited bettors are also the best new users for anything that works on sharp books and exchanges.\n- \"How to last longer\" content keeps users paying. BetUnfair already writes it.\n\n## 6. The bettor's ladder\n\n1. Casual betting, following tipsters.\n2. Matched betting on bonuses.\n3. Arbitrage.\n4. **Value betting and dropping odds** ← BetUnfair\n5. Brokers, Asian books, exchanges.\n6. Own models.\n\nA map of where to find users:\n- **One step below** (arbers, matched bettors): already pay for tools and know the maths. Easiest to convert.\n- **Same step** (users of rival tools): win them on price, speed or more books.\n- **Two steps below** (tipster followers): biggest crowd, hardest to teach. Reached through tipsters.\n\n```mermaid\nflowchart LR\n  L1[\"1 Casual betting<br/>following tipsters\"] --> L2[\"2 Matched betting<br/>on bonuses\"]\n  L2 --> L3[\"3 Arbitrage\"]\n  L3 --> L4[\"4 Value betting and dropping odds<br/>BetUnfair is here\"]\n  L4 --> L5[\"5 Brokers, Asian books, exchanges\"]\n  L5 --> L6[\"6 Own models\"]\n  U1[\"Same step - users of rival tools<br/>win on price, speed or more books\"] --> L4\n  U2[\"One step below - arbers and matched bettors<br/>already pay for tools · easiest to convert\"] --> L4\n  U3[\"Two steps below - tipster followers<br/>biggest crowd · hardest to teach\"] --> L4\n```\n\n## 7. BetUnfair features in these words\n\n| Feature | What it is in plain terms |\n|---|---|\n| Dropping odds alerts | Step 4 of the price life, sent in under 2 seconds |\n| EV comparison | Value betting: fair price from sharps vs prices at soft books |\n| Limit and volume spike alerts | The signals from section 4 |\n| Closed market alerts | News detector |\n| Graph centre | The life of a price, drawn |\n| Bet tracker with CLV | The scoreboard from [Betting maths](01-betting-maths.md) |\n| Stake calculator | Kelly, from [Betting maths](01-betting-maths.md) |\n\n---\n\n## Exercises\n\n1. Name two sharp books, two Asian books, two soft books and two exchanges.\n2. Why does a soft book limit a winning customer, and a sharp book does not?\n3. Value betting vs arbitrage in one sentence?\n4. What is a steam move? How is it different from one bettor's big bet?\n5. Most bets are on Team A. The price on Team B gets shorter. What is this called and what does it suggest?\n6. Give three things that make an account look like a professional's.\n7. A user was limited at four soft books. Name three things they can do next.\n8. Which two groups of bettors are the easiest new users for BetUnfair, and why?\n\n## Answers\n\n1. Sharp: Pinnacle, Circa. Asian: SBOBet, Singbet. Soft: Bet365, William Hill. Exchanges: Betfair, Smarkets.\n2. A soft book earns from losing players at a high margin, so a winner is pure cost. A sharp book earns a small margin on huge volume and uses winners' bets to set better prices.\n3. Arbitrage backs every outcome for a small sure profit. Value betting backs one outcome above fair value for a bigger average profit with swings.\n4. A sudden move across several sharp books at once, from coordinated professional money. One bettor moves one book; steam moves the market.\n5. Reverse line movement. Larger, sharper money is probably on Team B.\n6. Any three: betting only prices about to drop; odd stake sizes; small leagues; never using casino or accumulators.\n7. Open accounts in other countries or brands; use a broker for Asian books; move to exchanges, sharp books or prediction markets.\n8. Arbitrage and matched bettors (they already pay for tools; limits push them up the ladder) and users of rival value tools (same need; win on price, speed or coverage).\n", "notion": "https://app.notion.com/p/3f4fc839fab98114a456f0c12471c6d7", "notionFresh": true}, {"slug": "metrics", "label": "Product metrics", "group": "Study", "file": "study/METRICS.md", "md": "# Product metrics\n\nBetUnfair is a **subscription product with a free trial**. The growth maths is one chain:\n\n**visit → trial start → activated → paid → stays (month after month)**\n\nAll BetUnfair numbers below are **made up as examples**, except the prices. \"Rule of thumb\" rates are rough industry ranges, not facts about BetUnfair.\n\n---\n\n## 1. The 12 terms\n\n| Term | Plain meaning | Formula |\n|---|---|---|\n| Conversion rate | Share that takes the next step | next step ÷ this step |\n| Activation | New user does the first valuable thing | activated ÷ sign-ups |\n| Trial-to-paid | Share of trials that pay | payers ÷ trial starts |\n| ARPU | Average revenue per paying user per month | revenue ÷ payers |\n| MRR | Monthly recurring revenue | payers × ARPU |\n| Churn (monthly) | Share of payers who leave in a month | lost ÷ payers at month start |\n| Retention | The opposite of churn | 1 − churn |\n| Lifetime | How long an average payer stays | 1 ÷ monthly churn |\n| LTV | Money one payer brings in total | ARPU × gross margin × lifetime |\n| CAC | Cost to get one **payer** | spend ÷ new payers |\n| Payback | Months to earn back CAC | CAC ÷ (ARPU × margin) |\n| Cohort | People who started in the same month, followed over time | n/a |\n\nTwo more:\n- **Net revenue retention:** revenue now from last year's payers ÷ their revenue then. Above 100% means upgrades beat churn.\n- **Blended vs paid CAC:** blended counts free sign-ups (SEO, word of mouth); paid counts only ad or affiliate money. Always state which.\n\n---\n\n## 2. What \"activation\" could be here (guess)\n\nPick one action that predicts paying. Candidates: set the first dropping-odds alert; receive and open an alert; log the first bet in the tracker; join the Discord.\n\nApproach: find which trial action best predicts payment, then push every new trial to do it in the first session. A 5-day trial is short, so **day 1 matters most**. A user who sees no alert on day 1 is likely gone.\n\n---\n\n## 3. What is special about a betting tool\n\n- **Variance churn:** a user can do everything right and still lose for a month, then blame the tool. Fix: show closing line value, not only profit.\n- **Limits churn:** bookmakers limit winners, so a limited user needs the tool less. Fix: guides on lasting longer, more bookmakers, brokers.\n- **Season swings:** fewer games in some months. Fix: a pause plan instead of cancel; push other sports.\n- **Money-back promise:** refunds are part of the maths. Track the refund rate.\n- **Affiliates:** tipsters often take a share of revenue for life. Count it in the margin, not in CAC.\n- **Restricted ads:** Meta and Google limit betting ads, so SEO, affiliates, community and content matter more.\n\n---\n\n## 4. Worked example\n\nPrices: Basic €27, Pro €67, Sharp €96 a month.\n\n1. **ARPU.** Plan mix (made up): 50% Basic, 35% Pro, 15% Sharp. 0.50×27 + 0.35×67 + 0.15×96 = **€51.35**\n2. **Lifetime.** Monthly churn (made up): 15%. 1 ÷ 0.15 = **6.7 months**\n3. **LTV.** Gross margin (made up): 85%. 51.35 × 0.85 × 6.67 = **€291**\n4. **CAC.** Spend €3,000 → 400 trial starts → 25% pay → 100 payers. Cost per trial €7.50. **CAC = €30.**\n5. **Ratios.** LTV ÷ CAC = 291 ÷ 30 = **9.7**. Payback = 30 ÷ (51.35 × 0.85) = **0.7 months**.\n\n```mermaid\nflowchart LR\n%% source: our worked example: made-up plan mix, churn and margin; prices EUR 27 / 67 / 96 are BetUnfair's public prices\n  A1[\"Plan mix (made up)<br/>50% Basic €27 · 35% Pro €67 · 15% Sharp €96\"] --> B1[\"ARPU = 0.50×27 + 0.35×67 + 0.15×96<br/>= €51.35\"]\n  C1[\"Monthly churn (made up)<br/>15%\"] --> D1[\"Lifetime = 1 ÷ churn<br/>1 ÷ 0.15 = 6.7 months\"]\n  E1[\"Gross margin (made up)<br/>85%\"] --> F1[\"LTV = ARPU × margin × lifetime<br/>51.35 × 0.85 × 6.67 = €291\"]\n  B1 --> F1\n  D1 --> F1\n```\n\n```mermaid\nflowchart LR\n%% source: our worked example: made-up inputs (EUR 3,000 spend, 25% of trials pay)\n  A2[\"Spend<br/>€3,000\"] --> B2[\"400 trial starts<br/>€7.50 per trial\"]\n  B2 -->|\"25% pay\"| C2[\"100 payers\"]\n  C2 --> D2[\"CAC = spend ÷ new payers<br/>3,000 ÷ 100 = €30\"]\n  D2 --> E2[\"LTV ÷ CAC = 291 ÷ 30 = 9.7<br/>rule of thumb: 3 or more is healthy<br/>9.7 means the channel is under-funded\"]\n  D2 --> F2[\"Payback = 30 ÷ (51.35 × 0.85)<br/>= 0.7 months\"]\n```\n\n**Read it:** rule of thumb says 3 or more is healthy. 9.7 means the channel is under-funded. Scale it until the ratio drops towards 3.\n\n---\n\n## 5. Exercises (answers in section 7)\n\n**E1. Funnel.** One month: 20,000 visits, 600 trial starts, 420 activated, 132 paid. a) Each step's rate? b) Visit-to-paid?\n\n**E2. Which step to fix?** One step can be lifted by 10% (relative). Does the choice of step change the final number? How to choose?\n\n**E3. Churn kills.** Same ARPU (€51.35) and margin (85%). Compare LTV at 20% and at 10% monthly churn.\n\n**E4. Affiliate deal.** A tipster wants 30% of revenue for life, no upfront fee. ARPU €51.35, margin before the deal 85%, churn 15%. a) LTV after the deal? b) He instead asks €60 flat per paying user. Which is cheaper?\n\n**E5. Cohort table.** 100 people started paying in January. Still paying at the start of each month:\n\n| M1 | M2 | M3 | M4 | M5 | M6 |\n|---|---|---|---|---|---|\n| 100 | 78 | 66 | 59 | 55 | 52 |\n\na) Churn from each month to the next? b) What shape is it and what does it mean? c) Revenue per starting user over the 6 months at €51.35?\n\n**E6. Trial with or without card.** A (no card): 600 trials, 22% pay. B (card up front): 250 trials, 55% pay. Which wins on payers? What else to check?\n\n**E7. The 6-month plan.** The site shows Basic at €27 a month and €161.99 for 6 months. What is the discount? What does that tell us? (Check the live pricing page first.)\n\n**E8. Price test.** Basic goes from €27 to €32. Trial-to-paid on Basic falls from 22% to 20%. 300 Basic trials a month. Better or worse on new monthly revenue? What is missing from the test?\n\n**E9. SEO payback.** A content hire costs €3,000 a month. After 6 months the blog brings 150 extra trials a month, 22% pay, LTV €291. Payback?\n\n**E10. Flat revenue.** \"We get plenty of trials but revenue is flat.\" Name 4 things to check, in order.\n\n---\n\n## 6. Questions for 55 Tech\n\n1. Trial starts a month, and trial-to-paid?\n2. Monthly churn: flat, or does it drop after month 2?\n3. Plan mix: Basic / Pro / Sharp?\n4. Top 3 channels for trials. Which brings payers who stay?\n5. Which trial action predicts paying?\n6. Refund rate under the money-back promise?\n7. Do affiliates get a flat fee or revenue share?\n8. Why do people cancel? Is it asked at cancel?\n9. Share of users on 6-month plans?\n10. Which countries pay most?\n\n---\n\n## 7. Answers\n\n**E1.** a) 600÷20,000 = 3.0%. 420÷600 = 70%. 132÷420 = 31.4% (132÷600 = 22% trial-to-paid). b) 132÷20,000 = 0.66%.\n\n```mermaid\nflowchart TD\n%% source: our worked example: made-up funnel counts (exercise E1)\n  A3[\"20,000 visits\"] -->|\"600 ÷ 20,000 = 3.0%\"| B3[\"600 trial starts\"]\n  B3 -->|\"420 ÷ 600 = 70%\"| C3[\"420 activated\"]\n  C3 -->|\"132 ÷ 420 = 31.4%\"| D3[\"132 paid\"]\n  D3 -->|\"1 - churn each month\"| E3[\"Stays<br/>month after month\"]\n  D3 --> F3[\"Trial to paid = 132 ÷ 600 = 22%<br/>Visit to paid = 132 ÷ 20,000 = 0.66%\"]\n```\n\n**E2.** No. The steps multiply, so +10% at any step gives +10% payers (145 instead of 132). Choose the step furthest below a normal rate, cheapest to change, and under the team's control. Trial onboarding is usually cheapest.\n\n**E3.** At 20%: lifetime 5 months → 51.35×0.85×5 = €218. At 10%: 10 months → €436. Halving churn doubles LTV. Retention work often beats acquisition work.\n\n```mermaid\nxychart-beta\n%% source: our arithmetic on the made-up ARPU of EUR 51.35 and 85% margin (exercise E3)\n  title \"LTV per payer in euros by monthly churn\"\n  x-axis [\"20% churn\", \"15% churn\", \"10% churn\"]\n  y-axis \"LTV in euros\" 0 --> 500\n  bar [218, 291, 436]\n```\n\n**E4.** a) Margin drops to 55%. LTV = 51.35×0.55×6.67 = €188. The deal costs 291−188 = €103 per user. b) €60 flat is cheaper than €103. But revenue share has no risk if the user leaves in month 1, and it keeps the tipster promoting. Middle road: revenue share capped at 12 months.\n\n```mermaid\nflowchart LR\n%% source: our arithmetic on the made-up LTV of EUR 291 and a 30% revenue share (exercise E4)\n  A6[\"LTV before the deal<br/>€291 at 85% margin\"] --> B6[\"Revenue share 30%<br/>margin 85% - 30% = 55%\"]\n  B6 --> C6[\"LTV after = 51.35 × 0.55 × 6.67<br/>= €188\"]\n  C6 --> D6[\"Cost of the deal = 291 - 188<br/>= €103 per user\"]\n  D6 -->|\"compare\"| E6[\"Flat fee €60 per paying user<br/>cheaper than €103\"]\n```\n\n**E5.** a) 22%, 15.4%, 10.6%, 6.8%, 5.5%. b) Steep, then flat. Most loss is in months 1–2, so fix onboarding and early wins, not loyalty perks. One average churn number hides this; \"1 ÷ churn\" is wrong for young cohorts. c) (100+78+66+59+55+52)÷100 = 4.10 paid months → 4.10×51.35 = €210.\n\n```mermaid\nflowchart TD\n%% source: our worked example: a made-up cohort of 100 payers (exercise E5)\n  M1[\"Month 1<br/>100 paying\"] -->|\"22 lost ÷ 100 = 22%\"| M2[\"Month 2<br/>78 paying\"]\n  M2 -->|\"12 lost ÷ 78 = 15.4%\"| M3[\"Month 3<br/>66 paying\"]\n  M3 -->|\"7 lost ÷ 66 = 10.6%\"| M4[\"Month 4<br/>59 paying\"]\n  M4 -->|\"4 lost ÷ 59 = 6.8%\"| M5[\"Month 5<br/>55 paying\"]\n  M5 -->|\"3 lost ÷ 55 = 5.5%\"| M6[\"Month 6<br/>52 paying\"]\n  M6 --> G6[\"Paid months per starting user<br/>(100+78+66+59+55+52) ÷ 100 = 4.10<br/>4.10 × 51.35 = €210\"]\n```\n\n**E6.** A: 132 payers. B: 137.5. Near equal. Check B's refunds and chargebacks, each group's month-2 retention, support load and word of mouth. Decide on month-2 payers, not first payment.\n\n**E7.** 6×27 = €162, so €161.99 is no discount, if €27 is the true monthly price. Either the monthly price is higher and €27 is the \"per month on 6 months\" price, or there is no reason to prepay. Worth asking 55 Tech. Prepaid plans cut churn, so a real 6- or 12-month discount is a cheap test.\n\n**E8.** Before: 300×22% = 66 payers × 27 = €1,782. After: 300×20% = 60 × 32 = €1,920. Better by 7.7%. Missing: churn after the change, upgrades to Pro, effect on trial starts (the price is seen before the trial), and a test long enough to trust a 2-point move.\n\n**E9.** 150×22% = 33 payers a month × €291 = €9,603 of LTV a month against €3,000 cost. Six months of cost before results = €18,000 sunk, earned back in about 2 months of LTV once running. LTV arrives over 6–7 months, so cash payback is slower. Judge SEO at month 9, not month 3: slow to start, cheap to keep.\n\n**E10.** 1) Trial-to-paid by channel: are the new trials junk? 2) Activation: do users set an alert on day 1? 3) Churn by cohort: are payers leaving faster? 4) Plan mix and refunds: are people picking Basic or claiming the money back?\n", "notion": "https://app.notion.com/p/3f4fc839fab98162b3b7c0cd95d3fa1b", "notionFresh": true}]</script>

  var MOCKS = {}; try { MOCKS = JSON.parse(document.getElementById('mocks').textContent) || {}; } catch (e) {}
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (ch) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]; }); }
  function linkify(s) { // [text](url) and bare urls both become links
    return esc(s).replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)|(https?:\/\/[^\s,;)]+)/g, function (m, txt, u1, u2) { var u = u1 || u2; return '<a href="' + u + '" target="_blank" rel="noopener">' + (txt || u) + '</a>'; });
  }
  // "timeline / title X / section Y / Period : item : item / : more item" -> numbered stage cards
  function steps(code) {
    var box = document.createElement('div'), title = '', groups = [], cur = null, last = null;
    box.className = 'steps';
    code.split('\n').forEach(function (raw) {
      var line = raw.trim(); if (!line || line === 'timeline' || /^%%/.test(line)) return;
      var tm = line.match(/^title\s+(.+)$/); if (tm) { title = tm[1]; return; }
      var sm = line.match(/^section\s+(.+)$/); if (sm) { cur = { name: sm[1], items: [] }; groups.push(cur); return; }
      if (!cur) { cur = { name: '', items: [] }; groups.push(cur); }
      var parts = line.split(/\s+:\s+|^:\s*/).map(function (x) { return x.trim(); });
      if (/^:/.test(line)) { if (last) last.points = last.points.concat(parts.filter(Boolean)); return; }
      last = { head: parts[0], points: parts.slice(1).filter(Boolean) }; cur.items.push(last);
    });
    var html = title ? '<h4>' + esc(title) + '</h4>' : '';
    groups.forEach(function (g) {
      if (g.name) html += '<div class="group">' + esc(g.name) + '</div>';
      html += '<ol>' + g.items.map(function (it) {
        return '<li class="step"><b>' + esc(it.head) + '</b>' + (it.points.length ? '<ul>' + it.points.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '') + '</li>';
      }).join('') + '</ol>';
    });
    box.innerHTML = html; return box;
  }
  var bySlug = {}, byFile = {};
  pages.forEach(function (p) { bySlug[p.slug] = p; byFile[p.file] = p; byFile[p.file.split('/').pop()] = p; });
  var nav = document.getElementById('nav'), main = document.getElementById('main');

  function load() { try { return JSON.parse(localStorage.getItem('ticks') || '{}'); } catch (e) { return {}; } }
  function save(t) { try { localStorage.setItem('ticks', JSON.stringify(t)); } catch (e) {} }
  var ticks = load();

  function buildNav(current) {
    nav.textContent = '';
    var group = '';
    pages.forEach(function (p) {
      if (p.group !== group) { group = p.group; var h = document.createElement('h2'); h.textContent = group; nav.appendChild(h); }
      var a = document.createElement('a');
      a.href = '#' + p.slug; a.textContent = p.label;
      if (p.slug === current) a.setAttribute('aria-current', 'page');
      var total = (p.md.match(/^- \[ \]/gm) || []).length;
      if (total) {
        var done = 0;
        for (var i = 0; i < total; i++) if (ticks[p.slug + ':' + i]) done++;
        var s = document.createElement('small'); s.textContent = done + '/' + total; a.appendChild(s);
      }
      nav.appendChild(a);
    });
    var c = document.createElement('p'); c.className = 'count';
    c.innerHTML = 'Ticks are saved in this browser only.';
    nav.appendChild(c);
  }

  function show(slug) {
    var p = bySlug[slug] || pages[0];
    main.innerHTML = (p.notion ? '<p class="src">' + p.file + ' · <a href="' + p.notion + '">Open in Notion</a>' +
      (p.notionFresh ? '' : ' <span class="old">Notion copy is older than this page</span>') + '</p>' : '') + marked.parse(p.md);

    // tables scroll inside their own box
    main.querySelectorAll('table').forEach(function (t) {
      var w = document.createElement('div'); w.className = 'scroll'; t.parentNode.insertBefore(w, t); w.appendChild(t);
    });

    // task lists become real, remembered tick boxes
    main.querySelectorAll('li > input[type=checkbox]').forEach(function (box, i) {
      var li = box.parentNode, key = p.slug + ':' + i, id = 'tick-' + p.slug + '-' + i;
      var label = document.createElement('label'); label.htmlFor = id;
      while (box.nextSibling) label.appendChild(box.nextSibling);
      li.appendChild(label); li.className = 'task';
      box.disabled = false; box.id = id; box.checked = !!ticks[key];
      li.classList.toggle('done', box.checked);
      box.addEventListener('change', function () {
        if (box.checked) ticks[key] = 1; else delete ticks[key];
        save(ticks); li.classList.toggle('done', box.checked); buildNav(p.slug);
      });
    });

    // file names in the text become links to that page
    main.querySelectorAll('code').forEach(function (c) {
      var target = byFile[c.textContent.trim()];
      if (!target || target.slug === p.slug) return;
      var a = document.createElement('a'); a.className = 'file'; a.href = '#' + target.slug; a.textContent = target.label;
      c.parentNode.replaceChild(a, c);
    });

    // links written as file paths ([label](study/x.md)) go to that page, to the sister site, or become plain text
    main.querySelectorAll('a[href*=".md"]').forEach(function (a) {
      var href = a.getAttribute('href'); if (/^https?:/.test(href)) return;
      var f = href.split('#')[0].split('/').pop(), target = byFile[f];
      if (target) { a.setAttribute('href', '#' + target.slug); return; }
      if (ext.url && ext.files && ext.files[f]) { a.setAttribute('href', ext.url + '#' + ext.files[f]); return; }
      var s = document.createElement('span'); s.textContent = a.textContent; a.parentNode.replaceChild(s, a);
    });

    // diagrams: ```mermaid blocks become drawings in a frame; a "%% source:" line becomes the caption;
    // timelines are drawn as numbered stage cards (mermaid's own timeline draws arrows that lead nowhere)
    var diag = [];
    main.querySelectorAll('pre > code.language-mermaid').forEach(function (c) {
      var code = c.textContent, src = '', m = code.match(/^\s*%%\s*source:\s*(.+)$/m);
      if (m) { src = m[1].trim(); code = code.replace(m[0], ''); }
      var fig = document.createElement('figure'); fig.className = 'fig';
      if (/^\s*timeline\b/.test(code)) { fig.appendChild(steps(code)); }
      else { var d = document.createElement('div'); d.className = 'mermaid'; d.textContent = code; fig.appendChild(d); diag.push(d); }
      if (src) { var cap = document.createElement('figcaption'); cap.innerHTML = '<b>Source:</b> ' + linkify(src); fig.appendChild(cap); }
      c.parentNode.parentNode.replaceChild(fig, c.parentNode);
    });
    main.querySelectorAll('[data-mock]').forEach(function (slot) {
      var ids = slot.getAttribute('data-mock').split(/\s+/).filter(function (id) { return MOCKS[id]; });
      if (!ids.length) { slot.remove(); return; }
      slot.className = 'mocks';
      slot.innerHTML = ids.map(function (id) { var mk = MOCKS[id];
        return '<figure class="mockcard' + (mk.wide ? ' wide' : '') + '">' + mk.html + '<figcaption><span>' + esc(mk.badge || 'mock-up') + '</span>' + esc(mk.title) + '</figcaption></figure>'; }).join('');
    });
    if (diag.length && window.mermaid) {
      // a drawing a little wider than the column shrinks to fit (text stays readable down to 60%); wider ones scroll in their box
      var fit = function () { diag.forEach(function (d) {
        var s = d.querySelector('svg'); if (!s) return;
        s.style.maxWidth = 'none'; s.style.width = '';
        var w = s.getBoundingClientRect().width, box = d.clientWidth - 36; // the frame's own padding
        if (w > box && box / w >= 0.6) { s.style.width = box + 'px'; s.style.height = 'auto'; }
      }); };
      // labels are measured when drawn, so draw only after the web font has arrived (or they clip)
      var draw = function () { try { Promise.resolve(mermaid.run({ nodes: diag, suppressErrors: true })).then(fit, fit); } catch (e) {} };
      (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(draw, draw);
    }

    // overview: one card per page, grouped as in the menu; the line under each title is the page's own first sentence
    var holder = main.querySelector('#sections');
    if (holder) {
      var html = '', seen = [];
      pages.forEach(function (q) { if (seen.indexOf(q.group) === -1) seen.push(q.group); });
      seen.forEach(function (g) {
        var cards = pages.filter(function (q) { return q.group === g && q !== p; });
        if (!cards.length) return;
        html += '<h3>' + g + '</h3><div class="grid">' + cards.map(function (q) {
          var line = q.summary || (q.md.split('\n').filter(function (l) { return l.trim() && !/^(#|\||```|>|-|\*|\d+\.|<|!)/.test(l.trim()); })[0] || '');
          line = line.replace(/\[([^\]]+)\]\([^)]+\)/g, '$1').replace(/[*_`]/g, '').split(/(?<=[.!?])\s/)[0];
          var d = document.createElement('div'); d.textContent = line.length > 150 ? line.slice(0, 147) + '…' : line;
          return '<a href="#' + q.slug + '"><b>' + q.label.replace(/</g, '&lt;') + '</b><span>' + d.innerHTML + '</span></a>';
        }).join('') + '</div>';
      });
      holder.className = 'sections'; holder.innerHTML = html;
    }

    // answers stay hidden until asked for
    main.querySelectorAll('h2').forEach(function (h) {
      if (!/answers\s*$/i.test(h.textContent)) return;
      var d = document.createElement('details'); d.className = 'answers';
      var s = document.createElement('summary'); s.textContent = 'Show answers'; d.appendChild(s);
      var n = h.nextSibling;
      while (n && !(n.nodeType === 1 && /^H[12]$/.test(n.tagName))) { var next = n.nextSibling; d.appendChild(n); n = next; }
      h.parentNode.replaceChild(d, h);
    });

    // mark today's day on the plan
    var now = new Date(), stamp = now.toLocaleString('en-US', { month: 'short' }) + ' ' + now.getDate() + ')';
    main.querySelectorAll('h3').forEach(function (h) { if (h.textContent.indexOf(stamp) !== -1) h.className = 'today'; });

    // external links open outside
    main.querySelectorAll('a[href^="http"]').forEach(function (a) { a.target = '_blank'; a.rel = 'noopener'; });

    // previous / next
    var i = pages.indexOf(p), pager = document.createElement('div'); pager.className = 'pager';
    pager.innerHTML = (i > 0 ? '<a href="#' + pages[i - 1].slug + '">← ' + pages[i - 1].label + '</a>' : '<span></span>') +
      (i < pages.length - 1 ? '<a href="#' + pages[i + 1].slug + '">' + pages[i + 1].label + ' →</a>' : '');
    main.appendChild(pager);

    buildNav(p.slug); buildToc();
  }

  // "on this page": the page's sections; the one being read is marked
  var toc = document.getElementById('toc'), tocObs = null;
  function buildToc() {
    if (tocObs) tocObs.disconnect();
    var hs = [].slice.call(main.querySelectorAll('h2'));
    toc.innerHTML = '';
    if (hs.length <= 2) return;
    // wide screens: always open in the side column; narrow: a closed box above the page
    var wide = matchMedia('(min-width: 1280px)').matches;
    var box = document.createElement('details'); box.open = wide;
    var sm = document.createElement('summary'); sm.textContent = 'On this page'; box.appendChild(sm); toc.appendChild(box);
    var btns = hs.map(function (h) {
      var b = document.createElement('button'); b.type = 'button'; b.textContent = h.textContent;
      b.addEventListener('click', function () {
        if (!wide) box.open = false;
        h.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
      });
      box.appendChild(b); return b;
    });
    if (!('IntersectionObserver' in window)) return;
    tocObs = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) { if (en.isIntersecting) btns.forEach(function (b, i) { b.classList.toggle('on', hs[i] === en.target); }); });
    }, { rootMargin: '0px 0px -70% 0px' });
    hs.forEach(function (h) { tocObs.observe(h); });
  }

  // in-page links are routed in script: plain anchor jumps are swallowed by the viewer frame
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href^="#"]');
    if (!a) return;
    var slug = a.getAttribute('href').slice(1);
    if (!bySlug[slug]) { // a link to a heading on this page: scroll there (plain anchor jumps are swallowed too)
      var h = slug && document.getElementById(decodeURIComponent(slug));
      if (h && main.contains(h)) { e.preventDefault(); h.scrollIntoView({ block: 'start' }); }
      return;
    }
    e.preventDefault();
    try { history.replaceState(null, '', '#' + slug); } catch (err) {}
    show(slug); window.scrollTo(0, 0); main.focus({ preventScroll: true });
  });

  show((location.hash || '').slice(1));
})();
</script>
